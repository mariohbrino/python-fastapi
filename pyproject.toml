[project]
name = "zero"
version = "0.1.0"
description = "Add your description here"
authors = [
    {name = "Mario Brino", email = "mariobrino@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi[standard]>=0.143.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.fastapi]
entrypoint = "src.server:app"

[tool.coverage.run]
branch = true
source_dirs = ["src"]

[tool.coverage.report]
fail_under = 95
include_namespace_packages = true
show_missing = true
