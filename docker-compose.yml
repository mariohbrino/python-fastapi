networks:
  internal:
    driver: bridge

volumes:
  db_fastapi:

services:
  db-fastapi:
    image: postgres:18.1-alpine
    container_name: db_fastapi
    restart: unless-stopped
    environment:
      POSTGRES_DB: fastapi
      POSTGRES_USER: fastapi
      POSTGRES_PASSWORD: password
    ports:
      - 5453:5432
    volumes:
      - db_fastapi:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastapi -d fastapi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fastapi:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: fastapi
    restart: unless-stopped
    profiles: [ "deploy" ]
    ports:
      - 8000:8000
    volumes:
      - ./config.ini.docker:/app/config.ini
    networks:
      - internal
    depends_on:
      db-fastapi:
        condition: service_healthy
